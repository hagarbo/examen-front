name: CI/CD Examen
on:
  push:
    branches:
      - main
jobs:
  docker-image:
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4
      - name: Login en DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Build
        run: docker build -t ${{ secrets.DOCKER_USER }}/examen-front:latest .
      - name: Push
        run: docker push ${{ secrets.DOCKER_USER }}/examen-front:latest

  render-deploy-hook:
    needs: docker-image
    runs-on: ubuntu-latest
    steps:
      - run: curl ${{ secrets.RENDER_HOOK }}
